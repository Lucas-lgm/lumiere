appId: com.lumiere.app
productName: Lumiere
directories:
  output: dist
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - out/**/*
  # Exclude all platform library files (handled per-platform via extraFiles)
  - '!vendor/mpv/**/*'
  - '!vendor/whisper/**/*'
  - '!vendor/ffmpeg/**/*'
  - '!native/**/*'
  - build/**/*
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.video
  fileAssociations:
    - ext:
        - mp4
        - mkv
        - mov
        - avi
        - webm
        - flv
        - ts
        - m4v
        - mpg
        - mpeg
        - wmv
        - rmvb
        - 3gp
        - m2ts
        - mts
      name: Video File
      role: Viewer
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extraFiles:
    # macOS ARM64 libraries (currently only supporting arm64)
    - from: vendor/mpv/darwin-arm64/lib
      to: Resources/lib
      filter:
        - '**/*.dylib'
    # Native binding (only copy build artifacts, not sources or intermediate files)
    - from: native/build/Release/mpv_binding.node
      to: Resources/native/mpv_binding.node
    # Whisper.cpp CLI + dylib (AI subtitles)
    - from: vendor/whisper/darwin-arm64/bin
      to: Resources/whisper/bin
      filter:
        - whisper-cli
    - from: vendor/whisper/darwin-arm64/lib
      to: Resources/whisper/lib
      filter:
        - '**/*.dylib'
    # FFmpeg (audio extraction)
    - from: vendor/ffmpeg/darwin-arm64/bin
      to: Resources/ffmpeg/bin
      filter:
        - ffmpeg
dmg:
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows platform configuration (if future support is needed)
win:
  target:
    - target: nsis
      arch:
        - x64
  extraFiles:
    # Windows x64 libraries (DLLs in lib directory)
    - from: vendor/mpv/win32-x64/lib
      to: .
      filter:
        - '**/*.dll'
